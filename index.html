<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>필립 박 - 개인 위키</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#f5f5f5;padding:30px}.loading{max-width:700px;margin:auto;background:white;border:1px solid #ddd;padding:20px}</style></head><body><div class="loading">문서를 불러오는 중입니다…</div><script type="module">try{const names=['phillip_bundle_0.txt','phillip_bundle_1.txt','phillip_bundle_2.txt'];const parts=await Promise.all(names.map(x=>fetch('./'+x+'?v=2').then(r=>{if(!r.ok)throw new Error(x);return r.text()})));const bin=atob(parts.join(''));const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<div class="loading"><b>문서를 불러오지 못했습니다.</b><br>새로고침해 주세요.</div>';console.error(e);}</script></body></html>
