<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>필립 박 - 개인 위키</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#f5f5f5;padding:30px}.loading{max-width:700px;margin:auto;background:white;border:1px solid #ddd;padding:20px}</style></head><body><div class="loading">문서를 불러오는 중입니다…</div><script type="module">const files=['payload_0.txt','payload_1.txt','payload_2.txt','payload_3.txt','payload_4.txt'];try{const parts=await Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));const b64=parts.join('');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(text);document.close();}catch(e){document.body.innerHTML='<div class="loading"><b>문서를 불러오지 못했습니다.</b><br>페이지를 새로고침해 주세요.</div>';console.error(e);}</script></body></html>
